name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint manifests & shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON manifests with jq
        run: |
          set -euo pipefail
          for f in $(git ls-files '*.json'); do
            echo "checking $f"
            jq -e '.' "$f" > /dev/null
          done

      - name: bash -n on every shell script
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            echo "checking $f"
            bash -n "$f" || fail=1
          done < <(git ls-files '*.sh')
          exit "$fail"

      - name: shellcheck (advisory)
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
        continue-on-error: true

      - name: bash -n on fenced bash blocks inside SKILL.md
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, sys, tempfile, os
          ok = True
          for skill in pathlib.Path('.').rglob('SKILL.md'):
              src = skill.read_text()
              for i, b in enumerate(re.findall(r"```bash\n(.*?)\n```", src, flags=re.DOTALL), 1):
                  with tempfile.NamedTemporaryFile('w', suffix='.sh', delete=False) as f:
                      f.write("#!/usr/bin/env bash\n")
                      f.write(b)
                      path = f.name
                  r = subprocess.run(['bash', '-n', path], capture_output=True, text=True)
                  status = 'OK' if r.returncode == 0 else 'FAIL — ' + r.stderr.strip()
                  print(f"  {skill}#bash[{i}]: {status}")
                  if r.returncode != 0:
                      ok = False
                  os.unlink(path)
          sys.exit(0 if ok else 1)
          PY

  test:
    name: Fixture tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Ensure jq is installed
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            if [ "${{ matrix.os }}" = "macos-latest" ]; then
              brew install jq
            else
              sudo apt-get update && sudo apt-get install -y jq
            fi
          fi
          jq --version

      - name: Run install-codex-hook.sh fixtures
        run: bash plugins/tmux-codex-chat/tests/install-codex-hook-fixtures.sh
